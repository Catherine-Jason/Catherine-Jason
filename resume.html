<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catherine’s résumé | Catherine Jason</title>
  <meta name="description" content="Catherine Jason résumé with printable and shareable PDF view.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="resume-page">
  <main class="resume-page-wrapper">
    <div class="resume-back-row">
      <a href="index.html" class="resume-back-home" aria-label="Back Home">Back Home</a>
    </div>

    <header class="resume-header-block">
      <h1>Catherine’s résumé</h1>
    </header>

    <div class="resume-actions-row" aria-label="Résumé actions">
      <button type="button" class="resume-action-btn" onclick="window.print()" aria-label="Print résumé">
        <i class="fa-solid fa-print" aria-hidden="true"></i> Print
      </button>
      <button type="button" id="sendResumeBtn" class="resume-action-btn" aria-label="Send résumé">
        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send
      </button>
    </div>

    <section class="resume-pdf-frame" aria-label="Résumé PDF preview">
      <iframe
        src="Catherine_Jason_Resume.pdf#view=FitH"
        title="Catherine Jason résumé PDF">
        <p>
          Your browser cannot display this PDF inline.
          <a href="Catherine_Jason_Resume.pdf">Open Catherine_Jason_Resume.pdf</a>.
        </p>
      </iframe>
      <p class="resume-pdf-fallback">
        If the PDF preview does not load, <a href="Catherine_Jason_Resume.pdf">open the résumé directly</a>.
      </p>
    </section>
  </main>

  <footer>
    <p>© 2026 Catherine Jason</p>
  </footer>

  <script>
    (function () {
      const sendButton = document.getElementById("sendResumeBtn");
      const hostedPdfUrl = "https://catherine-jason.github.io/Catherine-Jason/Catherine_Jason_Resume.pdf";

      function openMailtoFallback() {
        const subject = encodeURIComponent("Catherine’s résumé");
        const body = encodeURIComponent("Hi,\n\nYou can view Catherine’s résumé here:\n" + hostedPdfUrl);
        window.location.href = "mailto:?subject=" + subject + "&body=" + body;
      }

      sendButton.addEventListener("click", async function () {
        if (navigator.share) {
          try {
            await navigator.share({
              title: "Catherine’s résumé",
              text: "View Catherine’s résumé",
              url: hostedPdfUrl
            });
            return;
          } catch (error) {
            if (error && error.name === "AbortError") {
              return;
            }
          }
        }

        openMailtoFallback();
      });
    })();
  </script>
</body>
</html>
