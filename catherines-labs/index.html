<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catherine's Labs</title>

    <!-- Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4ff;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #7A4FFF, #4F8BFF);
            color: white;
            margin: 0;
            font-size: 2.5rem;
        }

        .labs-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .lab-item {
            background: linear-gradient(135deg, #7A4FFF, #4F8BFF);
            padding: 30px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lab-icon {
            font-size: 60px;
            margin-bottom: 15px;
            color: white;
            opacity: 0.9;
        }

        .lab-item a {
            background: white;
            color: #4F3FFF;
            padding: 12px 20px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            width: fit-content;
            transition: 0.2s;
        }

        .lab-item a:hover {
            background: #e7e7ff;
        }
    </style>
</head>

<body>

<h1>Catherine's Labs</h1>

<div class="labs-container">

    <!-- Game One -->
    <div class="lab-item">
        <i class="fa-solid fa-shield-halved lab-icon"></i>
        <h2>Game One - SOC Alert Triage Demo</h2>
        <p>Cyber Adventure - Interactive Mini‑Game.</p>
        <a href="https://catherine-jason.github.io/soc-alert-triage-demo/" target="_blank">
            Play Game One
        </a>
    </div>

    <!-- Game Two -->
    <div class="lab-item">
        <i class="fa-solid fa-network-wired lab-icon"></i>
        <h2>Game Two - Network Infrastructure Simulator</h2>
        <p>Interactive Networking & WAN/LAN Configuration Training Game.</p>
        <a href="https://catherine-jason.github.io/network-infrastructure-sim/" target="_blank">
            Play Game Two
        </a>
    </div>

    <!-- Game Three -->
    <div class="lab-item">
        <i class="fa-solid fa-hourglass-half lab-icon"></i>
        <h2>Game Three</h2>
        <p>Future game... Coming soon!</p>
    </div>

</div>

</body>
</html>
