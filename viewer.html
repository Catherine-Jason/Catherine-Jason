<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Viewer</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111831;
      --text: #e8ecff;
      --muted: #b9c2ff;
      --accent: #6ea8fe;
      --accent-2: #8b5cf6;
      --border: #2a356b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #090d1a, #0f1630);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(12, 18, 39, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem;
    }

    .controls {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 0.98rem;
      color: var(--muted);
      margin-right: 0.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    button, a.action-link {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.55rem 0.8rem;
      border-radius: 10px;
      font-size: 0.92rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform .05s ease, background .2s ease, border-color .2s ease;
    }

    button:hover, a.action-link:hover {
      border-color: var(--accent);
      background: #17224a;
    }

    button:active, a.action-link:active { transform: translateY(1px); }

    .primary {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none;
      color: #fff;
    }

    .viewer-wrap {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0.75rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .viewer {
      flex: 1;
      min-height: 72vh;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #0a0f22;
    }

    iframe {
      width: 100%;
      height: 100%;
      min-height: 72vh;
      border: 0;
      background: white;
    }

    .note {
      font-size: 0.86rem;
      color: var(--muted);
      opacity: 0.9;
    }

    .error {
      color: #ffd3d3;
      background: #3a1111;
      border: 1px solid #7c2222;
      border-radius: 10px;
      padding: 0.75rem;
    }

    @media (max-width: 720px) {
      .title { width: 100%; order: 2; }
      .actions { width: 100%; order: 1; }
      button, a.action-link { flex: 1 1 auto; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="controls">
      <div id="docTitle" class="title">Loading document…</div>
      <div class="actions">
        <button id="backBtn" title="Go back">← Back</button>
        <a id="openBtn" class="action-link" href="#" target="_blank" rel="noopener noreferrer">View</a>
        <a id="downloadBtn" class="action-link" href="#" download>Download</a>
        <button id="printBtn" title="Print this document">Print</button>
        <button id="shareBtn" class="primary" title="Share this document">Share</button>
      </div>
    </div>
  </header>

  <main class="viewer-wrap">
    <div id="errorBox" class="error" style="display:none"></div>
    <div class="viewer">
      <iframe id="docFrame" title="Document preview"></iframe>
    </div>
    <div class="note">
      Tip: If preview fails in your browser, use <strong>View</strong> to open directly, then print/download from there.
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const title = params.get('title') || 'Document';

      const docTitle = document.getElementById('docTitle');
      const errorBox = document.getElementById('errorBox');
      const frame = document.getElementById('docFrame');
      const openBtn = document.getElementById('openBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const printBtn = document.getElementById('printBtn');
      const shareBtn = document.getElementById('shareBtn');
      const backBtn = document.getElementById('backBtn');

      function showError(msg) {
        errorBox.style.display = 'block';
        errorBox.textContent = msg;
      }

      if (!file) {
        docTitle.textContent = 'Missing file parameter';
        showError('No file provided. Open this page with ?file=your-document.pdf');
        return;
      }

      const decodedFile = decodeURIComponent(file);
      const safeTitle = title.replace(/\+/g, ' ');
      docTitle.textContent = safeTitle;

      // Keep links/actions consistent
      openBtn.href = decodedFile;
      downloadBtn.href = decodedFile;
      downloadBtn.setAttribute('download', '');

      // Preview in iframe
      frame.src = decodedFile;

      // Back behavior: preserve history when available, fallback to home.
      backBtn.addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });

      // Print behavior: try iframe first; fallback open + print
      printBtn.addEventListener('click', function () {
        try {
          const w = frame.contentWindow;
          if (w) {
            w.focus();
            w.print();
            return;
          }
        } catch (e) {
          // Cross-origin / browser restrictions fallback below
        }
        const pop = window.open(decodedFile, '_blank', 'noopener,noreferrer');
        if (pop) {
          pop.focus();
          setTimeout(() => {
            try { pop.print(); } catch (_) {}
          }, 600);
        }
      });

      // Share behavior: native share first, clipboard fallback
      shareBtn.addEventListener('click', async function () {
        const shareUrl = new URL(decodedFile, window.location.href).toString();
        const shareData = {
          title: safeTitle,
          text: 'Here is the document:',
          url: shareUrl
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (e) {
            // user canceled or unavailable -> fallback
          }
        }

        try {
          await navigator.clipboard.writeText(shareUrl);
          shareBtn.textContent = 'Link Copied';
          setTimeout(() => (shareBtn.textContent = 'Share'), 1400);
        } catch (e) {
          prompt('Copy this link:', shareUrl);
        }
      });
    })();
  </script>
</body>
</html>
