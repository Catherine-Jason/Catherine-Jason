<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Honors | Catherine Jason</title>
  <meta name="description" content="Catherine Jason honors page with embedded Phi Theta Kappa certificate.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body id="top">

<header class="cert-detail-header">
  <h1><i class="fa-solid fa-award"></i> Honors</h1>
  <p>Academic recognition and official documentation.</p>
  <nav class="cert-nav-row">
    <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
    <button type="button" class="cert-nav-btn" id="honorsBackBtn">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>
  </nav>
</header>

<main class="cert-detail-body">

  <div class="cert-info-card">
    <h2><i class="fa-solid fa-medal"></i> Phi Theta Kappa Honor Society</h2>
    <div class="cert-meta-row">
      <div class="cert-meta-item">
        <strong>Organization</strong>
        Phi Theta Kappa Honor Society
      </div>
      <div class="cert-meta-item">
        <strong>Chapter</strong>
        Alpha Psi Psi Chapter
      </div>
      <div class="cert-meta-item">
        <strong>Recognition</strong>
        Academic Honor Society
      </div>
    </div>
  </div>

  <div class="cert-info-card">
    <h2><i class="fa-solid fa-file-pdf"></i> Embedded Certificate</h2>
    <div class="cert-image-wrap">
      <object data="PTK_cert.pdf" type="application/pdf" aria-label="Phi Theta Kappa certificate PDF">
        <p class="cert-pdf-fallback">
          Can't view the PDF here?
          <a href="PTK_cert.pdf" target="_blank" rel="noopener noreferrer">Open the certificate directly</a>
        </p>
      </object>
    </div>
  </div>

</main>

<a class="back-to-top" href="#top" aria-label="Back to top">↑ Top</a>

<footer>
  <p>© 2026 Catherine Jason</p>
</footer>

<script>
  (function () {
    const backButton = document.getElementById("honorsBackBtn");
    const fallbackUrl = "index.html#honors";

    backButton.addEventListener("click", function () {
      if (document.referrer) {
        const previousUrl = document.createElement("a");
        previousUrl.href = document.referrer;

        if (previousUrl.origin === window.location.origin) {
          window.history.back();
          return;
        }
      }

      window.location.href = fallbackUrl;
    });
  })();
</script>

</body>
</html>
